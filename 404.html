<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません | Ezo Hazel</title>
<!-- 存在しないURLに 404 を返すためのページ（このファイルがないと、Cloudflare Pages はどのURLにもトップページを 200 で返し、検索エンジンに「ソフト404」と判断される）。 -->
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* トークンは index.html と共通（Material Design 3 を基調。色は明るく、文字はやや大きく） */
  :root {
    --color-primary: #C49800;
    --color-primary-container: #F6ECCF;
    --color-on-primary-container: #16311C;
    --color-background: #FAF8F2;
    --color-on-surface: #22281F;
    --color-on-surface-variant: #46523F;
    --font-family: "Noto Sans JP", "Noto Sans", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 112.5%; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: var(--font-family);
    background: var(--color-background);
    color: var(--color-on-surface);
    line-height: 1.7;
  }
  main { max-width: 36rem; text-align: center; }
  h1 { margin: 0 0 .75rem; font-size: 1.6rem; font-weight: 700; }
  p { margin: 0 0 1.5rem; color: var(--color-on-surface-variant); }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  a.button {
    display: inline-flex;
    align-items: center;
    min-height: 3rem;
    padding: 0 1.5rem;
    border-radius: 1.5rem;
    font-weight: 700;
    text-decoration: none;
    color: var(--color-on-primary-container);
    background: var(--color-primary);
  }
  a.button.secondary { background: var(--color-primary-container); }
  :focus-visible { outline: 3px solid var(--color-on-primary-container); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは、移動したか、存在しない可能性があります。</p>
  <div class="actions">
    <a class="button" href="/">トップページへ</a>
    <a class="button secondary" href="/about">About</a>
  </div>
</main>
</body>
</html>
